<div *ngIf="reponseloading" class="loader">
  <img src="assets/Images/loader.gif" />
  <span class="loading-message">Please wait...</span>
</div>

<div class="auth-root">

  <nav class="auth-navbar">
    <div class="nav-brand">
      <img src="/assets/Images/PrepTimerV2LogoTrans.png" class="nav-logo" alt="Logo">
      <div class="nav-brand-text">
        <span class="nav-title">Antunes Prep Timer</span>
        <span class="nav-subtitle">Restaurant Operations Platform</span>
      </div>
    </div>
  </nav>

  <main class="auth-body auth-body--centered">
    <div class="login-section login-section--solo">
      <div class="login-card">

        <div class="login-card-header">
          <h2>Forgot password?</h2>
          <p>Enter the email associated with your account and we'll send you a reset link.</p>
        </div>

        <ng-container *ngIf="!successMessage; else sentBlock">
          <form #forgotForm="ngForm" (ngSubmit)="submit()" novalidate>
            <div class="field-wrap">
              <label for="emailInput">Email address</label>
              <div class="input-row">
                <i class="fa fa-envelope-o field-icon"></i>
                <input type="email" id="emailInput" class="field-input"
                       name="email" placeholder="Enter your email"
                       required [(ngModel)]="email" #emailCtl="ngModel">
              </div>
              <span *ngIf="submitted && emailCtl.errors?.required" class="field-error">
                Email is required
              </span>
            </div>

            <button type="submit" class="btn-signin">Send reset link</button>
          </form>
        </ng-container>

        <ng-template #sentBlock>
          <div class="success-banner">
            <i class="fa fa-check-circle"></i>
            <span>{{ successMessage }}</span>
          </div>
        </ng-template>

        <div class="forgot-row forgot-row--center">
          <a href="javascript:void(0)" class="forgot-link" (click)="backToLogin()">Back to sign in</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="auth-footer">
    <p class="footer-copy">© 2024–2025 Antunes Digital™. All rights reserved.</p>
  </footer>
</div>
