<nav class="app-navbar">
  <div class="nav-container">

    <!-- Brand logo -->
    <a class="nav-brand">
      <img [src]="headerData?.companyLogo"
           onError="this.src='assets/Images/AntunesLogoWhiteNoTagline.png'"
           class="brand-logo" alt="Brand">
    </a>

    <!-- Mobile hamburger -->
    <button class="nav-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMain"
            aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
      <i class="fa fa-bars"></i>
    </button>

    <!-- Collapsible nav body -->
    <div class="collapse navbar-collapse nav-body" id="navMain">

      <!-- Dynamic menus from API -->
      <ul class="nav-links">
        <li class="nav-link-item dropdown"
            [class.has-dropdown]="menu?.subMenus?.length > 0"
            *ngFor="let menu of menuList">
          <ng-container *ngIf="menu?.subMenus?.length > 0; else singleLink">
            <a class="nav-link-btn dropdown-toggle"
               data-bs-toggle="dropdown" data-bs-offset="0,4" aria-expanded="false">
              {{ menu.displayName }}
              <i class="fa fa-chevron-down chevron"></i>
            </a>
            <ul class="nav-dropdown dropdown-menu">
              <li *ngFor="let sub of menu.subMenus">
                <a class="nav-dropdown-item" [href]="sub.menuURL">{{ sub.displayName }}</a>
              </li>
            </ul>
          </ng-container>
          <ng-template #singleLink>
            <a class="nav-link-btn" [href]="menu.menuURL"
               *ngIf="menu.menuName !== 'Support'">{{ menu.displayName }}</a>
          </ng-template>
        </li>

        <!-- Administration -->
        <li class="nav-link-item has-dropdown dropdown">
          <a class="nav-link-btn dropdown-toggle"
             data-bs-toggle="dropdown" data-bs-offset="0,4" aria-expanded="false">
            Administration
            <i class="fa fa-chevron-down chevron"></i>
          </a>
          <ul class="nav-dropdown dropdown-menu">
            <li><a class="nav-dropdown-item" routerLink="/preptimer/users">User Management</a></li>
            <li><a class="nav-dropdown-item" routerLink="/preptimer/translations">Translations</a></li>
          </ul>
        </li>

        <!-- Prep Timer -->
        <li class="nav-link-item has-dropdown dropdown">
          <a class="nav-link-btn dropdown-toggle"
             data-bs-toggle="dropdown" data-bs-offset="0,4" aria-expanded="false">
            Prep Timer
            <i class="fa fa-chevron-down chevron"></i>
          </a>
          <ul class="nav-dropdown dropdown-menu">
            <li><a class="nav-dropdown-item" routerLink="/preptimer/categories">Categories</a></li>
            <li><a class="nav-dropdown-item" routerLink="/preptimer/condiments">Items</a></li>
          </ul>
        </li>
      </ul>

      <!-- User avatar menu -->
      <div class="nav-user dropdown">
        <a class="user-btn dropdown-toggle" data-bs-toggle="dropdown"
           data-bs-offset="0,4" aria-expanded="false">
          <span class="user-avatar"><i class="fa fa-user-circle"></i></span>
          <span class="user-label">Admin</span>
          <i class="fa fa-chevron-down chevron"></i>
        </a>
        <ul class="nav-dropdown dropdown-menu dropdown-menu-end user-dropdown">
          <li class="user-dropdown-header">
            <i class="fa fa-user-circle user-header-icon"></i>
            <span>Admin</span>
          </li>
          <li class="dropdown-divider-line"></li>
          <li>
            <a class="nav-dropdown-item" routerLink="/registration/mysubscriptions">
              <i class="fa fa-credit-card"></i> My Subscription
            </a>
          </li>
          <li class="dropdown-divider-line"></li>
          <li>
            <a class="nav-dropdown-item nav-dropdown-item--danger" (click)="logout()">
              <i class="fa fa-sign-out"></i> Sign Out
            </a>
          </li>
        </ul>
      </div>

    </div>
  </div>
</nav>
