              #storeName="ngModel" placeholder="Store Name"/>

            <div *ngIf="detailsForm.submitted && storeName.invalid" class="error-text">
                <div *ngIf="storeName.errors.required">Name is required</div>
            </div>
        </div>

        <div class="mb-3 col-md-6">
            <label  class="mb-1">Address</label>

            <input type="text" name="storeAddress1" class="form-control" [(ngModel)]="storeDetails.address1"
              #storeAddress1="ngModel" placeholder="Enter Address"/>

            <div *ngIf="detailsForm.submitted && storeAddress1.invalid" class="error-text">
                <div *ngIf="storeAddress1.errors.required">Address details are required</div>
            </div>
        </div>

        <div class="mb-3 col-md-6">
            <label  class="mb-1">City</label>
          
            <input type="text" name="storeCity" class="form-control" [(ngModel)]="storeDetails.city"
                  #storeCity="ngModel" placeholder="Enter City"/>

             <div *ngIf="detailsForm.submitted && storeCity.invalid" class="error-text">
                <div *ngIf="storeCity.errors.required">City details are required</div>
            </div>
        </div>

        <div class="mb-3 col-md-6">
            <label   class="mb-1">Country</label>

            <select name="storeCountry"  id="storeCountry" #storeCountry="ngModel" 
            class="custom-select custom-select-custom form-control"
                 [(ngModel)]="storeDetails.country" (ngModelChange)="countryChanged($event)">
                 <option value="undefined">Select Country</option>
                 <option *ngFor="let c of countriesList" [ngValue]="c.iso3">{{c.name}}</option>
             </select>

             <div *ngIf="detailsForm.submitted && storeCountry.invalid" class="error-text">
                <div *ngIf="storeCountry.errors.required">Country details are required</div>
            </div>
        </div>

        <div class="mb-3 col-md-6">
            <label  class="mb-1">State</label>
        
            <select name="storeState"  id="storeState" #storeState="ngModel" 
            class="custom-select custom-select-custom form-control"
                [(ngModel)]="storeDetails.state">
                <option value="undefined">Select State</option>
                <option *ngFor="let c of stateList" [ngValue]="c.subDivisionIsoCode">{{c.name}}</option>
            </select>
        
            <div *ngIf="detailsForm.submitted && storeState.invalid" class="error-text">
                <div *ngIf="storeState.errors.required">State details are required</div>
            </div>
        </div>

        <div class="mb-3 col-md-6">
            <label  class="mb-1">Zip Code</label>
          
            <input type="text" maxlength="5" name="storeZipcode" class="form-control" [(ngModel)]="storeDetails.zipcode"
            (keypress)="allowOnlyNumbers($event)" (ngModelChange)="calGeoCode()"  #storeZipcode="ngModel" placeholder="Enter Zip Code"/>

             <div *ngIf="detailsForm.submitted && storeZipcode.invalid" class="error-text">
                <div *ngIf="storeZipcode.errors.required">ZIP code details are required</div>
            </div>
        </div>

                <div *ngIf="storephone.errors.required">Phone details are required</div>
            </div>
        </div>  -->
</div>
</div>

</form>
