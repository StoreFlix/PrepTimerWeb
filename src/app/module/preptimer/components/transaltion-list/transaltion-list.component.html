<div class="container mt-4">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="page-title mb-1" style="color:#1A3668; font-size:1.5rem; font-weight:500;">
                Translation Management
            </h4>
            <p class="page-subtext text-muted mb-0" style="font-size:0.8rem;">
                Manage language translations for the Prep Timer app
            </p>
        </div>
        <div>
            <button class="btn" style="background-color:#1A3668; color:white;"
                    routerLink="/preptimer/translation/add">
                <i class="fas fa-plus"></i> Add Translation
            </button>
        </div>
    </div>

    <div class="mb-3">
        <input type="text" class="form-control w-50" [(ngModel)]="searchText"
               placeholder="Search translations...">
    </div>

    <div class="table-responsive">
        <table class="table table-hover border">
            <thead class="bg-light">
                <tr>
                    <th>Name</th>
                    <th>Locale</th>
                    <th>File</th>
                    <th>Modified On</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of filteredTranslations()">
                    <td>{{ item.name }}</td>
                    <td>{{ item.locale }}</td>
                    <td>
                        <a [href]="item.filePath" download target="_blank">
                            <i class="fas fa-file-alt" style="color:#1A3668"></i>
                        </a>
                    </td>
                    <td>{{ item.modifiedOn | date:'MM/dd/yyyy' }}</td>
                    <td class="text-center">
                        <button class="btn btn-sm edit-btn" (click)="onEdit(item.id)">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm delete-btn" (click)="onDelete(item.id)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
                <tr *ngIf="filteredTranslations().length === 0">
                    <td colspan="5" class="text-center text-muted py-4">No translations found</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
