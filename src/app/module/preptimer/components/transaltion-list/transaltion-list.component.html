<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Search Input -->
        <div class="w-50">
            <input type="text" class="form-control" [(ngModel)]="searchText" placeholder="Search translations...">
        </div>
        <!-- Add Translation Button -->
        <button class="btn btn-success" routerLink="/preptimer/translation/add"  style="background-color: #1a3668;color:white">
            <!-- <i class="fas fa-plus"></i>  -->
            
            Add Translation
        </button>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-hover border">
            <thead class="bg-light">
                <tr>
                    <th>Name</th>
                    <th>Locale</th>
                    <th>File</th>
                    <th>Modified On</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of filteredTranslations()">
                    <td>{{ item.name }}</td>
                    <td>{{ item.locale }}</td>
                    <td><a [href]="item.filePath" download target="_blank" class="text-primary"> <i class="fas fa-file-alt" style="color:#1a3668"></i></a></td>
                    <td>{{ item.modifiedOn | date:'MM/dd/yyyy' }}</td>
                    <td class="text-center">
                        <button class="btn btn-sm edit-btn" (click)="onEdit(item.id)">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm delete-btn" (click)="onDelete(item.id)">
                            <i class="fas fa-trash"></i>
                        </button>
                        
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
