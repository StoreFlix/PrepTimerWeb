<div class="card mt-3">
    <div class="card-body">
      <h5>{{ category ? 'Edit' : 'Add' }} Category</h5>
      <div class="form-group">
        <label>Name</label>
        <input [(ngModel)]="categoryName" class="form-control" />
      </div>
      <!-- Later add dropdown for store mapping -->
      <div class="mt-3">
        <button class="btn btn-success" (click)="save()">Save</button>
        <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
      </div>
    </div>
  </div>
