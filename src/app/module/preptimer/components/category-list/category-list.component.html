

<!-- Bootstrap Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-3 shadow-lg border-0">
        <form (ngSubmit)="saveCategory()" #categoryForm="ngForm">
          <div class="modal-header" style="background-color: #1A3668;padding:0.6rem;color:white">
            <h3 class="modal-title" style="color: white !important;" id="categoryModalLabel">{{ isEditMode ? 'Edit' : 'Add' }} Category</h3>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
  
          <div class="modal-body px-4 py-3">
            <div class="row g-3">
  
              <!-- Category Name -->
              <div class="col-12">
                <label for="categoryName" class="form-label fw-semibold">Category Name</label>
                <input type="text" [(ngModel)]="categoryModel.categoryName" name="name" required id="categoryName" class="form-control" placeholder="Enter category name" />
              </div>
  
              <!-- Store Selector -->
              <div class="col-12">
                <label for="storeSelect" class="form-label fw-semibold">Assign to Stores</label>
                <select multiple [(ngModel)]="categoryModel.storeIds" name="storeIds" id="storeSelect" class="form-select" size="5">
                  <option [value]="0">All</option>
                  <option *ngFor="let store of stores" [value]="store.id">{{ store.name }}</option>
                </select>
                <small class="text-muted d-block mt-1">Hold Ctrl (Windows) or Cmd (Mac) to select multiple stores.</small>
              </div>
  
            </div>
          </div>
  
          <div class="modal-footer px-4 py-3">
            <button type="submit" class="btn" style="background-color: #1A3668;color:white !important" >
              <i class="fas fa-save me-1"></i> Save
            </button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

<div class="container mt-4">
    <!-- Add Item Button -->
    <!-- <div class="d-flex justify-content-end mb-3">
        <button class="btn" style="background-color: #1A3668; color: white;" (click)="openAddCategory()">
            <i class="fas fa-plus"></i> Add Category
        </button>
    </div> -->

    <div class="d-flex align-items-center justify-content-between mb-4">
        <!-- Title + Subtext -->
        <div>
            <h4 class="page-title mb-1" style="color:#1A3668; font-size:1.5rem; font-weight:500;">
                Category Management
            </h4>
            <p class="page-subtext text-muted mb-0" style="font-size:0.8rem;">
                Manage default and custom categories used in Prep Timer
            </p>
        </div>
    
        <!-- Add Item Button -->
        <div>
            <button class="btn" style="background-color: #1A3668; color: white;" (click)="openAddCategory()">
              <i class="fas fa-plus"></i> Add Category
            </button>
        </div>
    </div>

    <div class="row">
        <!-- Default Items Section -->
        <div class="col-md-6">
            <div class="border rounded p-3">
                <h4 class="mb-3" style="color: #1A3668;">Default Categories</h4>
                <div class="default-items" style="height: 400px; overflow-y: auto; scrollbar-width: thin;">
                    <div  *ngFor="let cat of defaultCategories" class="item-card d-flex align-items-center p-3 border-bottom" style="background-color: #f9f9f9;">
                        <div class="icon-box">
                            <i class="fas fa-utensils p-3"></i>
                        </div>
                        <div class="flex-grow-1">
                            <h4 class="mb-1 item-name">{{cat.categoryName}}</h4>
                        </div>
                        <div class="d-flex align-items-center">
                            <button class="btn btn-sm action-btn">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Items Section -->
        <div class="col-md-6">
            <div class="border rounded p-3">
                <h4 class="mb-3" style="color: #1A3668;">Custom Categories</h4>
                <div class="custom-items" style="height: 400px; overflow-y: auto; scrollbar-width: thin;">
                    <ng-container *ngIf="customCategories.length > 0; else noCustomData">
                      <div *ngFor="let cat of customCategories" class="item-card d-flex align-items-center p-3 border-bottom" style="background-color: #f9f9f9;">
                        <div class="icon-box">
                          <i class="fas fa-utensils p-3"></i>
                        </div>
                        <div class="flex-grow-1">
                          <h4 class="mb-1 item-name">{{cat.categoryName}}</h4>
                        </div>
                        <div class="d-flex align-items-center">
                          <button class="btn btn-sm edit-btn" (click)="openEditCategory(cat)">
                            <i class="fas fa-edit"></i>
                          </button>
                          <button class="btn btn-sm delete-btn" (click)="deleteCategory(cat.categoryId)">
                            <i class="fas fa-trash"></i>
                          </button>
                        </div>
                      </div>
                    </ng-container>
                    <ng-template #noCustomData>
                      <div class="text-center text-muted mt-5">
                        No Data available
                      </div>
                    </ng-template>
                  </div>
            </div>
        </div>
    </div>
</div>
